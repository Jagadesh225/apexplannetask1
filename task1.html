<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics of Web Development</title>
    <style>
        /* CSS for styling */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        h1, h2 {
            color: #2c3e50;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        img {
            max-width: 100%;
            height: auto;
            border: 2px solid #ddd;
            border-radius: 5px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <h1>Welcome to our website</h1>
    <h2>Gain knowledge through the Apexplanet</h2>
    <p>This webpage demonstrates the basics of HTML, CSS, and JavaScript.</p>
    <p>Here is an example image:</p>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZULgn7jR5IH6sCNm5PjEnH1xTaSLFJLmx8w&s" alt="Example Image">
    <p>Click here <a href="https://www.freecodecamp.org/news/html-css-and-javascript-explained-for-beginners/" target="_blank">web documets</a> for more resources.</p>
    <button class="button" onclick="showAlert()">Click Me</button>

    <script>
        function showAlert() {
            alert('welcome to our website.');
        }
    </script>
</body>
</html>
